<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohi's Gallery</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      padding: 24px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      cursor: pointer;
    }

    /* The big-photo overlay: hidden by default */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    /* When JavaScript adds the "open" class, it appears */
    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
    }
  </style>
</head>
<body>
  <h1>Mohi's Gallery</h1>

  <div class="gallery">
    <img src="photo1.JPG">
    <img src="photo2.JPG">
    <img src="photo3.JPG">
    <img src="photo4.JPG">
	<img src="photo5.JPG">
	<img src="photo6.JPG">
  </div>

  <div class="lightbox" id="lightbox">
    <img id="big-photo">
  </div>

  <script>
    const photos = document.querySelectorAll(".gallery img");
    const lightbox = document.getElementById("lightbox");
    const bigPhoto = document.getElementById("big-photo");

    photos.forEach(function (photo) {
      photo.addEventListener("click", function () {
        bigPhoto.src = photo.src;
        lightbox.classList.add("open");
      });
    });

    lightbox.addEventListener("click", function () {
      lightbox.classList.remove("open");
    });
	
	document.addEventListener("keydown", function (event){
		if (event.code === "Escape") {lightbox.classList.remove("open");}});
  </script>
</body>
</html>
